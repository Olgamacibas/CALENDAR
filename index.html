<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мой Календарь</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#006B6C">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Montserrat:wght@400;500;700&family=Lato:wght@400;700&family=Inter:wght@400;500;700&family=Playfair+Display:wght@500;700&family=Merriweather:wght@400;700&family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }

  :root {
    --bg-color: #8da4c4; 
    --card-bg: #9bb2d4; 
    --primary: #111e2e;
    --text-color: #111e2e; 
    --subtext: #3d5066; 
    --border-color: #7890b0; 
    --input-bg: #b0c4e0;
    --accent: #4a6585; 
    --accent-text: #ffffff;

    --holiday-border: #9B113F; 
    --pre-border:     #6D8291; 
    --work-border:    #00A896; 

    --today-bg: #cad8ec; 
    --today-border: #111e2e;
    --note-bg: #b0c4e0; 
    --note-text: #111e2e;
    
    --font-family: 'Nunito', sans-serif;
    --font-scale: 1;

    --main-shadow: 0 16px 32px rgba(20, 35, 55, 0.25);
    --bg-gradient: radial-gradient(circle at center, #9bb2d4 0%, #687e9c 100%);
  }

  [data-theme="blue-light"] {
    --bg-color: #8da4c4; --card-bg: #9bb2d4; --primary: #111e2e;
    --text-color: #111e2e; --subtext: #3d5066; --border-color: #7890b0; 
    --input-bg: #b0c4e0; --accent: #4a6585; --accent-text: #ffffff;
    --today-bg: #cad8ec; --today-border: #111e2e; --note-bg: #b0c4e0; 
    --note-text: #111e2e; --main-shadow: 0 16px 32px rgba(20, 35, 55, 0.25);
    --bg-gradient: radial-gradient(circle at center, #9bb2d4 0%, #687e9c 100%);
  }

  [data-theme="blue-dark"] {
    --bg-color: #08101e; --card-bg: #0e1b2e; --primary: #ffffff;
    --text-color: #e2e8f0; --subtext: #8294b0; --border-color: #1e3048; 
    --input-bg: #15243b; --accent: #1e3d6b; --accent-text: #ffffff;
    --today-bg: #1e3048; --today-border: #8294b0; --note-bg: #15243b; 
    --note-text: #e2e8f0; --main-shadow: 0 20px 40px rgba(0,0,0,0.8);
    --bg-gradient: radial-gradient(circle at center, #0e1b2e 0%, #03060c 100%);
  }

  [data-theme="dark"] {
    --bg-color: #121212; --card-bg: #1e1e1e; --primary: #ecf0f1;
    --text-color: #e0e0e0; --subtext: #aaa; --border-color: #333333; 
    --input-bg: #2a2a2a; --accent: #37474f; --accent-text: #ffffff;
    --today-bg: #2c3e50; --today-border: #7f8c8d; --note-bg: #2a2a2a; 
    --note-text: #e0e0e0; --main-shadow: 0 20px 40px rgba(0,0,0,0.8);
    --bg-gradient: radial-gradient(circle at center, #1e1e1e 0%, #050505 100%);
  }

  [data-theme="green"] {
    --bg-color: #003637; --card-bg: #006B6C; --primary: #ffffff;
    --text-color: #e0f2f1; --subtext: #80cbc4; --border-color: #00897b; 
    --input-bg: #005657; --accent: #004d40; --accent-text: #ffffff;
    --today-bg: #00897b; --today-border: #80cbc4; --note-bg: #004546; 
    --note-text: #e0f2f1; --main-shadow: 0 18px 36px rgba(0, 20, 20, 0.5);
    --bg-gradient: radial-gradient(circle at center, #005657 0%, #002223 100%);
  }

  [data-theme="gray"] {
    --bg-color: #2b3238; --card-bg: #5B6770; --primary: #ffffff;
    --text-color: #f8f9fa; --subtext: #d1d5db; --border-color: #717d86; 
    --input-bg: #4a545b; --accent: #3b444b; --accent-text: #ffffff;
    --today-bg: #717d86; --today-border: #ffffff; --note-bg: #4a545b; 
    --note-text: #ffffff; --main-shadow: 0 18px 36px rgba(0,0,0,0.4);
    --bg-gradient: radial-gradient(circle at center, #4a545b 0%, #1a1e22 100%);
  }

  [data-theme="light-gray"] {
    --bg-color: #bcbcbc; --card-bg: #B2B8BB; --primary: #1c2326;
    --text-color: #1a2124; --subtext: #455054; --border-color: #92999c; 
    --input-bg: #c7cbce; --accent: #6c7a80; --accent-text: #ffffff;
    --today-bg: #d2d7d9; --today-border: #1c2326; --note-bg: #c7cbce; 
    --note-text: #1a2124; --main-shadow: 0 16px 30px rgba(0,0,0,0.25);
    --bg-gradient: radial-gradient(circle at center, #d2d7d9 0%, #8d9498 100%);
  }

  [data-theme="pink"] {
    --bg-color: #d1c0c6; --card-bg: #D2C4C9; --primary: #382c30;
    --text-color: #2b2024; --subtext: #59484f; --border-color: #b5a5ab; 
    --input-bg: #dfd3d7; --accent: #8c707a; --accent-text: #ffffff;
    --today-bg: #e8dee2; --today-border: #382c30; --note-bg: #dfd3d7; 
    --note-text: #2b2024; --main-shadow: 0 16px 32px rgba(60, 40, 50, 0.3);
    --bg-gradient: radial-gradient(circle at center, #e8dee2 0%, #a39097 100%);
  }

  html, body {
    min-height: 100vh;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-family);
    background-color: var(--bg-color);
    background-image: var(--bg-gradient); 
    background-attachment: fixed;
    color: var(--text-color);
    -webkit-tap-highlight-color: transparent; 
    display: flex; 
    flex-direction: column;
    align-items: center;
    font-size: calc(14px * var(--font-scale));
  }

  .container { 
    width: 100%; 
    max-width: 640px; 
    margin: 0 auto; 
    padding: 12px 8px 90px 8px;
  }

  .card {
    background: var(--card-bg); 
    border-radius: 18px; 
    padding: 12px 8px;
    box-shadow: var(--main-shadow); 
    width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .view-section { display: none; flex-direction: column; width: 100%; align-items: center; }
  .view-section.active { display: flex; }

  .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; width: 100%; }
  h2 { margin: 0; font-size: calc(14px * var(--font-scale)); font-weight: 700; color: var(--primary); text-transform: uppercase; }

  .icon-btn {
    background: var(--input-bg); 
    border: 1px solid var(--border-color);
    color: var(--text-color); 
    padding: 6px 10px; 
    border-radius: 8px; 
    cursor: pointer; 
    font-size: calc(13px * var(--font-scale)); 
    font-family: var(--font-family);
  }

  .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .input-group { display: flex; flex-direction: column; }
  .input-group label { font-size: calc(11px * var(--font-scale)); color: var(--subtext); margin-bottom: 3px; font-weight: 600; }
  .input-group input, select, textarea {
    width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 8px;
    font-size: calc(13px * var(--font-scale)); font-weight: 600; outline: none; background: var(--input-bg); color: var(--text-color);
    font-family: var(--font-family);
  }

  .result-box {
    grid-column: span 2; background: var(--input-bg); border-left: 4px solid var(--accent);
    padding: 8px; border-radius: 0 8px 8px 0; margin-top: 4px;
  }
  .result-time { font-size: calc(16px * var(--font-scale)); font-weight: 700; color: var(--primary); }
  .result-note { font-size: calc(11px * var(--font-scale)); color: var(--subtext); }

  .month-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; width: 100%; }
  .nav-btn {
    background: var(--input-bg); border: 1px solid var(--border-color);
    border-radius: 8px; padding: 6px 14px; font-weight: bold; 
    font-size: calc(15px * var(--font-scale)); color: var(--primary); font-family: var(--font-family);
    cursor: pointer;
  }
  .month-title { font-size: calc(16px * var(--font-scale)); font-weight: 700; color: var(--primary); display: flex; gap: 6px; align-items: center; }

  .cal-table { 
    width: 100%; 
    border-collapse: collapse; 
    table-layout: fixed; 
  }
  
  .cal-table th { 
    font-size: calc(11px * var(--font-scale)); 
    color: var(--subtext); 
    padding-bottom: 6px; 
    font-weight: 700; 
    text-align: center; 
  }
  
  .cal-table td { 
    padding: 1px; 
    width: 14.28%; 
    min-height: 60px;
    vertical-align: top; 
    cursor: pointer;
    border: 1px solid var(--border-color); 
  }

  .day-cell {
    min-height: 58px; 
    width: 100%; 
    border-radius: 4px; 
    padding: 2px;
    display: flex; 
    flex-direction: column; 
    justify-content: flex-start;
    align-items: stretch; 
    position: relative; 
    border: 2px solid transparent; 
    box-sizing: border-box;
  }

  .day-num { 
    font-size: calc(12px * var(--font-scale)); 
    font-weight: 600; 
    text-align: center; 
    line-height: 1; 
    margin-bottom: 2px;
  }
  
  .has-text .day-num {
    font-size: calc(10px * var(--font-scale)); 
    font-weight: 700; 
    text-align: left; 
    padding-left: 1px;
  }

  .day-label {
    font-size: calc(8px * var(--font-scale)); 
    line-height: 1.1; 
    padding: 2px; 
    border-radius: 3px;
    margin-top: 1px; 
    word-break: break-word;
    background: var(--note-bg); 
    color: var(--note-text); 
    font-weight: 600; 
    text-align: left;
  }

  .holiday-label { background: var(--holiday-border); color: #ffffff; }
  .work-sat-label { background: var(--work-border); color: #ffffff; }
  .pre-hol-label { background: var(--pre-border); color: #ffffff; }

  .today .day-cell { border: 2px solid var(--today-border) !important; background-color: var(--today-bg); }
  .holiday .day-cell { border: 2px solid var(--holiday-border) !important; }
  .pre-hol .day-cell { border: 2px solid var(--pre-border) !important; }
  .work-sat .day-cell { border: 2px solid var(--work-border) !important; }

  .weekend { background-color: rgba(255, 255, 255, 0.06); }
  .weekend .day-num { color: #e74c3c; }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; width: 100%;
    background: var(--card-bg); border-top: 1px solid var(--border-color);
    padding: 6px; display: flex; flex-direction: column; gap: 4px; z-index: 50;
    box-shadow: 0 -6px 16px rgba(0,0,0,0.15);
  }
  .bottom-row { display: flex; gap: 4px; justify-content: space-between; }
  .bottom-btn {
    flex: 1; background: var(--input-bg); border: 1px solid var(--border-color);
    color: var(--text-color); padding: 8px 2px; border-radius: 8px;
    font-size: calc(11px * var(--font-scale)); font-weight: 600; text-align: center; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-family);
  }
  
  .bottom-btn.active { 
    background: var(--accent) !important; 
    color: var(--accent-text) !important; 
    border-color: var(--accent) !important; 
  }

  .modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); justify-content: center; align-items: center; z-index: 100;
  }
  .modal-content {
    background: var(--card-bg); padding: 16px; border-radius: 16px; width: 85%; max-width: 360px;
    color: var(--text-color); border: 1px solid var(--border-color); max-height: 85vh; overflow-y: auto;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }

  .popover {
    display: none; position: fixed; left: 5%; right: 5%; top: 20%;
    background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 14px;
    padding: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 90;
  }

  .event-list {
    background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px;
    padding: 8px; margin-bottom: 8px; max-height: 120px; overflow-y: auto;
  }
  .event-item {
    font-size: calc(12px * var(--font-scale));
    font-weight: 600;
    padding: 4px 6px;
    border-radius: 4px;
    margin-bottom: 4px;
  }
  .event-item:last-child { margin-bottom: 0; }
  .event-empty { font-size: calc(11px * var(--font-scale)); color: var(--subtext); font-style: italic; text-align: center; }

  .btn-primary {
    width: 100%; 
    background: var(--accent); 
    color: var(--accent-text); 
    font-weight: bold;
    border: none;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: calc(13px * var(--font-scale));
    font-family: var(--font-family);
  }
</style>
</head>
<body onload="init()">

<div class="container">

  <div id="viewCalendar" class="view-section active">
    <div class="card">
      <div class="month-header">
        <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
        <div class="month-title">
          <span id="monthTitleText"></span>
          <select id="yearSelect" style="border:none; background:transparent;" onchange="onYearChange()"></select>
        </div>
        <button class="nav-btn" onclick="changeMonth(1)">›</button>
      </div>

      <table class="cal-table">
        <thead>
          <tr id="weekdaysHeader"></tr>
        </thead>
        <tbody id="calBody"></tbody>
      </table>
    </div>
  </div>

  <div id="viewCalc" class="view-section">
    <div class="card">
      <div class="top-header">
        <h2 id="txtCalcTitle">⏱ Калькулятор смены</h2>
      </div>
      
      <div class="calc-grid">
        <div class="input-group">
          <label id="txtStartWork">Начало работы</label>
          <input type="time" id="startTime" value="08:30" oninput="calculateShift()">
        </div>
        <div class="input-group">
          <label id="txtNormHours">Норма (часов)</label>
          <input type="number" id="workHours" value="8.5" step="0.5" oninput="calculateShift()">
        </div>
        <div class="input-group">
          <label id="txtBreakMins">Обед / Паузы (мин)</label>
          <input type="number" id="breakMins" value="30" step="5" oninput="calculateShift()">
        </div>
        <div class="input-group">
          <label id="txtShorten">Сокращение (ч)</label>
          <input type="number" id="shortenHours" value="0" step="0.5" min="0" oninput="calculateShift()">
        </div>
        <div class="result-box">
          <div class="result-time" id="endTime">--:--</div>
          <div class="result-note" id="calcDetails">Заполните параметры</div>
        </div>
      </div>
    </div>
  </div>

  <div class="popover" id="dayPopover">
    <div style="display:flex; justify-content:space-between; align-items:center; font-weight:700; margin-bottom:8px;">
      <span id="popoverTitle">--.--.----</span>
      <button class="icon-btn" onclick="closePopover()" style="padding:2px 6px;">✕</button>
    </div>

    <div class="event-list" id="eventList">
      <div class="event-empty">Записей нет</div>
    </div>

    <div class="input-group" style="margin-bottom: 8px;">
      <label id="txtNoteLabel">Заметка:</label>
      <textarea id="userNoteInput" rows="2" placeholder="Добавить запись..."></textarea>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn-primary" style="flex:1;" onclick="saveNote()" id="btnSave">Сохранить</button>
      <button class="icon-btn" style="background:#e74c3c; color:#fff;" onclick="deleteNote()" id="btnClear">Очистить</button>
    </div>
  </div>

</div>

<div class="bottom-bar">
  <div class="bottom-row">
    <button class="bottom-btn active" id="tabBtnCal" onclick="switchView('calendar')">📅 Календарь</button>
    <button class="bottom-btn" id="tabBtnCalc" onclick="switchView('calc')">⏱ Калькулятор</button>
  </div>
  <div class="bottom-row">
    <button class="bottom-btn" id="btnTodayBar" onclick="goToToday()">📍 Сегодня</button>
    <button class="bottom-btn" id="btnPaletteBar" onclick="openPalette()">🎨 Палитра</button>
    <button class="bottom-btn" id="btnImportBar" onclick="document.getElementById('icsFileInput').click()">📂 ICS</button>
    <button class="bottom-btn" id="btnSettingsBar" onclick="openSettings()">⚙️ Меню</button>
  </div>
</div>
<input type="file" id="icsFileInput" accept=".ics" style="display:none" onchange="importIcsFile(event)">

<div class="modal" id="paletteModal">
  <div class="modal-content">
    <h3 style="margin-top:0;" id="txtPaletteTitle">🎨 Палитра стилей</h3>

    <div class="input-group" style="margin-bottom: 10px;">
      <label id="txtFontLabel">Шрифт 🔤</label>
      <select id="fontSelect" onchange="changeFont(this.value)">
        <option value="'Roboto', sans-serif">Roboto (Классический)</option>
        <option value="'Open Sans', sans-serif">Open Sans (Мягкий)</option>
        <option value="'Montserrat', sans-serif">Montserrat (Современный)</option>
        <option value="'Lato', sans-serif">Lato (Элегантный)</option>
        <option value="'Inter', sans-serif">Inter (Строгий)</option>
        <option value="'Nunito', sans-serif">Nunito (Округлый)</option>
        <option value="'Ubuntu', sans-serif">Ubuntu (Корпоративный)</option>
        <option value="'Comfortaa', cursive">Comfortaa (Арт)</option>
        <option value="'Playfair Display', serif">Playfair Display (Засечки)</option>
        <option value="'Merriweather', serif">Merriweather (Книжный)</option>
      </select>
    </div>

    <div class="input-group" style="margin-bottom: 10px;">
      <label id="txtZoomLabel">Масштаб текста: <span id="zoomValue">100%</span></label>
      <input type="range" id="zoomRange" min="0.7" max="1.2" step="0.05" value="1" oninput="changeZoom(this.value)">
    </div>

    <div class="input-group" style="margin-bottom: 14px;">
      <label id="txtThemeLabel">Тема оформления 🎨</label>
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="blue-light" id="optThemeBlueLight">Голубая 🩵</option>
        <option value="blue-dark" id="optThemeBlueDark">Синяя 💙</option>
        <option value="green" id="optThemeGreen">Холодный изумруд 🌲</option>
        <option value="gray" id="optThemeGray">Темный графит 🩶</option>
        <option value="light-gray" id="optThemeLightGray">Дымчато-серый ☁️</option>
        <option value="pink" id="optThemePink">Нежная роза 🌸</option>
        <option value="default" id="optThemeDefault">Светлая классика ☀️</option>
        <option value="dark" id="optThemeDark">Глубокая ночь 🌙</option>
      </select>
    </div>
    
    <button class="btn-primary" onclick="closeModal('paletteModal')" id="btnClosePalette">Готово</button>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-content">
    <h3 style="margin-top:0;" id="txtSettingsTitle">⚙️ Меню</h3>
    
    <div class="input-group" style="margin-bottom: 10px;">
      <label id="txtLangLabel">Язык интерфейса 🌐</label>
      <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="ru">Русский 🇷🇺</option>
        <option value="lv">Latviešu 🇱🇻</option>
        <option value="en">English 🇬🇧</option>
        <option value="de">Deutsch 🇩🇪</option>
        <option value="et">Eesti 🇪🇪</option>
        <option value="lt">Lietuvių 🇱🇹</option>
        <option value="pl">Polski 🇵🇱</option>
      </select>
    </div>

    <div class="input-group" style="margin-bottom: 14px;">
      <label id="txtCountryLabel">Страна праздников 🌍</label>
      <select id="countrySelect" onchange="changeCountry(this.value)">
        <option value="LV">Латвия 🇱🇻</option>
        <option value="DE">Германия 🇩🇪</option>
        <option value="EE">Эстония 🇪🇪</option>
        <option value="LT">Литва 🇱🇹</option>
        <option value="PL">Польша 🇵🇱</option>
        <option value="NONE">Без праздников 🚫</option>
      </select>
    </div>
    
    <button class="btn-primary" onclick="closeModal('settingsModal')" id="btnCloseModal">Закрыть</button>
  </div>
</div>

<script>
const holidaysData = {
  LV: {
    holidays: {
      "1-1": "Jaunais gads", "4-3": "Lielā piektdiena", "4-5": "1. Lieldienas", "4-6": "2. Lieldienas",
      "5-1": "Darba svētki", "5-4": "Neatkarība", "6-23": "Līgo", "6-24": "Jāņi",
      "11-18": "Valsts svētki", "12-24": "Ziemassvētku vakars", "12-25": "1. Ziemassvētki",
      "12-26": "2. Ziemassvētki", "12-31": "Vecgada diena"
    },
    preHolidays: ["4-2", "4-30", "6-22", "11-17", "12-23", "12-30"],
    workSaturdays: { "1-17": "Отработка", "6-27": "Отработка" }
  },
  DE: {

    preHolidays: ["12-24", "12-31"], workSaturdays: {}

    preHolidays: ["2-23", "6-22", "12-23", "12-31"], workSaturdays: {}
  },
  LT: {
    holidays: { "1-1": "Naujieji metai", "2-16": "Valstybės atkūrimo d.", "3-11": "Nepriklausomybė", "5-1": "Darbo diena", "6-24": "Joninės", "7-6": "Mindaugo karūnavimas", "8-15": "Žolinė", "11-1": "Visų šventųjų d.", "11-2": "Vėlinės", "12-24": "Kūčios", "12-25": "1. Kalėdos", "12-26": "2. Kalėdos" },
    preHolidays: ["2-15", "3-10", "7-5", "10-31", "12-23"], workSaturdays: {}
  },
  PL: {

    preHolidays: ["4-30", "5-2", "11-10", "12-24", "12-31"], workSaturdays: {}

};

  ru: {
    cal: "📅 Календарь", calc: "⏱ Калькулятор", today: "📍 Сегодня", palette: "🎨 Палитра", import: "📂 ICS", settings: "⚙️ Меню",
    weekdays: ["ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ", "ВС"],
    months: ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"],
    calcTitle: "⏱ Калькулятор смены", startWork: "Начало работы", normHours: "Норма (часов)", breakMins: "Обед / Паузы (мин)", shorten: "Сокращение (ч)",
    paletteTitle: "🎨 Палитра стилей", settingsTitle: "⚙️ Меню", langLabel: "Язык интерфейса 🌐", countryLabel: "Страна праздников 🌍", themeLabel: "Тема оформления 🎨", fontLabel: "Шрифт 🔤", zoomLabel: "Масштаб текста:", close: "Закрыть", done: "Готово",
    noteLabel: "Заметка:", save: "Сохранить", clear: "Очистить", noEvents: "Записей нет", preHolText: "-1ч", preHolFull: "Сокращенный предпраздничный день (-1ч)",

    weekdays: ["P", "O", "T", "C", "P", "S", "Sv"],
    months: ["Janvāris", "Februāris", "Marts", "Aprīlis", "Maijs", "Jūnijs", "Jūlijs", "Augusts", "Septembris", "Oktobris", "Novembris", "Decembris"],
    calcTitle: "⏱ Maiņu kalkulators", startWork: "Darba sākums", normHours: "Norma (stundas)", breakMins: "Pārtraukums (min)", shorten: "Saīsinājums (st)",
    paletteTitle: "🎨 Stilu palete", settingsTitle: "⚙️ Iestatījumi", langLabel: "Valoda 🌐", countryLabel: "Svētku valsts 🌍", themeLabel: "Tēma 🎨", fontLabel: "Šrifts 🔤", zoomLabel: "Teksta mērogs:", close: "Aizvērt", done: "Gatavs",
    noteLabel: "Piezīme:", save: "Saglabāt", clear: "Notīrīt", noEvents: "Nav ierakstu", preHolText: "-1st", preHolFull: "Saīsinātā pirmssvētku diena (-1st)",
    themeBlueLight: "Zila 🩵", themeBlueDark: "Tumši zila 💙"
  }
};

let currentLang = localStorage.getItem('myCalendarLang') || 'ru';
let now = new Date();
let currentYear = now.getFullYear();
let currentMonth = now.getMonth();
let activeKey = "";
let selectedCountry = localStorage.getItem('myCalendarCountry') || 'LV';
let myNotes = JSON.parse(localStorage.getItem('myCalendarNotes') || '{}');

function init() {
  populateYears();
  
  let savedTheme = localStorage.getItem('myCalendarTheme') || 'blue-light';
  document.getElementById('themeSelect').value = savedTheme;
  changeTheme(savedTheme);

  let savedFont = localStorage.getItem('myCalendarFont') || "'Nunito', sans-serif";
  document.getElementById('fontSelect').value = savedFont;
  changeFont(savedFont, false);

  let savedZoom = localStorage.getItem('myCalendarZoom') || '1';
  document.getElementById('zoomRange').value = savedZoom;
  changeZoom(savedZoom, false);

  document.getElementById('countrySelect').value = selectedCountry;
  document.getElementById('langSelect').value = currentLang;
  
  applyLanguage();
  updateCalendar();
  calculateShift();
}

function applyLanguage() {
  let t = translations[currentLang] || translations['ru'];
  document.getElementById('tabBtnCal').innerText = t.cal;
  document.getElementById('tabBtnCalc').innerText = t.calc;
  document.getElementById('btnTodayBar').innerText = t.today;
  document.getElementById('btnPaletteBar').innerText = t.palette;
  document.getElementById('btnImportBar').innerText = t.import;
  document.getElementById('btnSettingsBar').innerText = t.settings;

  document.getElementById('txtCalcTitle').innerText = t.calcTitle;
  document.getElementById('txtStartWork').innerText = t.startWork;
  document.getElementById('txtNormHours').innerText = t.normHours;
  document.getElementById('txtBreakMins').innerText = t.breakMins;
  document.getElementById('txtShorten').innerText = t.shorten;
  
  document.getElementById('txtPaletteTitle').innerText = t.paletteTitle;
  document.getElementById('txtSettingsTitle').innerText = t.settingsTitle;
  document.getElementById('txtLangLabel').innerText = t.langLabel;
  document.getElementById('txtCountryLabel').innerText = t.countryLabel;
  document.getElementById('txtThemeLabel').innerText = t.themeLabel;
  document.getElementById('txtFontLabel').innerText = t.fontLabel;
  document.getElementById('btnCloseModal').innerText = t.close;
  document.getElementById('btnClosePalette').innerText = t.done;

  document.getElementById('optThemeBlueLight').innerText = t.themeBlueLight;
  document.getElementById('optThemeBlueDark').innerText = t.themeBlueDark;

  let trH = document.getElementById('weekdaysHeader');
  trH.innerHTML = '';
  t.weekdays.forEach(w => {
    let th = document.createElement('th');
    th.innerText = w;
    trH.appendChild(th);
  });
}

function changeLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('myCalendarLang', lang);
  applyLanguage();
  updateCalendar();
}

function changeCountry(country) {
  selectedCountry = country;
  localStorage.setItem('myCalendarCountry', country);
  updateCalendar();
}

function changeTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('myCalendarTheme', theme);
}

function changeFont(fontFamily, save = true) {
  document.documentElement.style.setProperty('--font-family', fontFamily);
  if (save) localStorage.setItem('myCalendarFont', fontFamily);
}

function changeZoom(scaleVal, save = true) {
  document.documentElement.style.setProperty('--font-scale', scaleVal);
  document.getElementById('zoomValue').innerText = Math.round(scaleVal * 100) + '%';
  if (save) localStorage.setItem('myCalendarZoom', scaleVal);
}

function populateYears() {
  let select = document.getElementById('yearSelect');
  select.innerHTML = '';
  for (let y = 2024; y <= 2030; y++) {
    let opt = document.createElement('option');
    opt.value = y; opt.innerText = y;
    if (y === currentYear) opt.selected = true;
    select.appendChild(opt);
  }
}

function updateCalendar() {
  let t = translations[currentLang] || translations['ru'];
  document.getElementById('monthTitleText').innerText = t.months[currentMonth];
  document.getElementById('yearSelect').value = currentYear;

  let calBody = document.getElementById('calBody');
  calBody.innerHTML = '';

  let firstDay = new Date(currentYear, currentMonth, 1).getDay();
  let startingDay = (firstDay === 0) ? 6 : firstDay - 1; 
  let monthLength = new Date(currentYear, currentMonth + 1, 0).getDate();

  let cData = holidaysData[selectedCountry] || { holidays: {}, preHolidays: [], workSaturdays: {} };

  let date = 1;
  while (date <= monthLength) {
    let row = document.createElement('tr');

    for (let j = 0; j < 7; j++) {
      let cell = document.createElement('td');
      if (calBody.children.length === 0 && j < startingDay) {
        row.appendChild(cell);
      } else if (date > monthLength) {
        row.appendChild(cell);
      } else {
        let currentDate = date;
        let fullKey = `${currentYear}-${currentMonth + 1}-${currentDate}`;
        let shortKey = `${currentMonth + 1}-${currentDate}`;
        let cellDiv = document.createElement('div');
        cellDiv.className = 'day-cell';
        
        if (j === 5 || j === 6) cell.className = 'weekend';

        if (cData.holidays[shortKey]) {
          cell.className += ' holiday';
        } else if (cData.preHolidays.includes(shortKey)) {
          cell.className += ' pre-hol';
        } else if (cData.workSaturdays[shortKey]) {
          cell.className += ' work-sat';
        }

        if (currentDate === now.getDate() && currentMonth === now.getMonth() && currentYear === now.getFullYear()) {
          cell.className += ' today';
        }

        let numDiv = document.createElement('div');
        numDiv.className = 'day-num';
        numDiv.innerText = currentDate;
        cellDiv.appendChild(numDiv);

        if (cData.holidays[shortKey]) {
          let hLabel = document.createElement('div');
          hLabel.className = 'day-label holiday-label';
          hLabel.innerText = cData.holidays[shortKey];
          cellDiv.appendChild(hLabel);
          cellDiv.classList.add('has-text');
        } else if (cData.preHolidays.includes(shortKey)) {
          let pLabel = document.createElement('div');
          pLabel.className = 'day-label pre-hol-label';
          pLabel.innerText = t.preHolText || "-1h";
          cellDiv.appendChild(pLabel);
          cellDiv.classList.add('has-text');
        } else if (cData.workSaturdays[shortKey]) {
          let wLabel = document.createElement('div');
          wLabel.className = 'day-label work-sat-label';
          wLabel.innerText = cData.workSaturdays[shortKey];
          cellDiv.appendChild(wLabel);
          cellDiv.classList.add('has-text');
        }

        if (myNotes[fullKey]) {
          let label = document.createElement('div');
          label.className = 'day-label';
          label.innerText = myNotes[fullKey];
          cellDiv.appendChild(label);
          cellDiv.classList.add('has-text');
        }

        cell.onclick = () => openPopover(fullKey, currentDate);
        cell.appendChild(cellDiv);
        row.appendChild(cell);
        date++;
      }
    }
    calBody.appendChild(row);
  }
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  updateCalendar();
}

function onYearChange() {
  currentYear = parseInt(document.getElementById('yearSelect').value);
  updateCalendar();
}

function switchView(view) {
  document.getElementById('viewCalendar').classList.remove('active');
  document.getElementById('viewCalc').classList.remove('active');
  document.getElementById('tabBtnCal').classList.remove('active');
  document.getElementById('tabBtnCalc').classList.remove('active');

  if (view === 'calendar') {
    document.getElementById('viewCalendar').classList.add('active');
    document.getElementById('tabBtnCal').classList.add('active');
  } else {
    document.getElementById('viewCalc').classList.add('active');
    document.getElementById('tabBtnCalc').classList.add('active');
  }
}

function goToToday() {
  currentYear = now.getFullYear();
  currentMonth = now.getMonth();
  updateCalendar();
  switchView('calendar');
}

function calculateShift() {
  let start = document.getElementById('startTime').value;
  let workH = parseFloat(document.getElementById('workHours').value) || 0;
  let breakM = parseFloat(document.getElementById('breakMins').value) || 0;
  let shorten = parseFloat(document.getElementById('shortenHours').value) || 0;

  if (!start) return;
  let [h, m] = start.split(':').map(Number);
  let totalMinutes = h * 60 + m + (workH - shorten) * 60 + breakM;

  let endH = Math.floor(totalMinutes / 60) % 24;
  let endM = Math.round(totalMinutes % 60);

  let formattedH = String(endH).padStart(2, '0');
  let formattedM = String(endM).padStart(2, '0');

  document.getElementById('endTime').innerText = `${formattedH}:${formattedM}`;
}

function openPopover(key, dateNum) {
  activeKey = key;
  let t = translations[currentLang] || translations['ru'];
  document.getElementById('popoverTitle').innerText = `${dateNum}.${currentMonth + 1}.${currentYear}`;
  
  let eventList = document.getElementById('eventList');
  eventList.innerHTML = '';
  
  let shortKey = `${currentMonth + 1}-${dateNum}`;
  let cData = holidaysData[selectedCountry] || { holidays: {}, preHolidays: [], workSaturdays: {} };
  let hasEvents = false;

  if (cData.holidays[shortKey]) {
    let item = document.createElement('div');
    item.className = 'event-item holiday-label';
    item.innerText = cData.holidays[shortKey];
    eventList.appendChild(item);
    hasEvents = true;
  }

  if (cData.preHolidays.includes(shortKey)) {
    let item = document.createElement('div');
    item.className = 'event-item pre-hol-label';
    item.innerText = t.preHolFull || t.preHolText;
    eventList.appendChild(item);
    hasEvents = true;
  }

  if (cData.workSaturdays[shortKey]) {
    let item = document.createElement('div');
    item.className = 'event-item work-sat-label';
    item.innerText = cData.workSaturdays[shortKey];
    eventList.appendChild(item);
    hasEvents = true;
  }

  if (!hasEvents) {
    eventList.innerHTML = `<div class="event-empty">${t.noEvents}</div>`;
  }

  document.getElementById('userNoteInput').value = myNotes[key] || '';
  document.getElementById('dayPopover').style.display = 'block';
}

function closePopover() {
  document.getElementById('dayPopover').style.display = 'none';
}

function saveNote() {
  let val = document.getElementById('userNoteInput').value.trim();
  if (val) {
    myNotes[activeKey] = val;
  } else {
    delete myNotes[activeKey];
  }
  localStorage.setItem('myCalendarNotes', JSON.stringify(myNotes));
  closePopover();
  updateCalendar();
}

function deleteNote() {
  delete myNotes[activeKey];
  localStorage.setItem('myCalendarNotes', JSON.stringify(myNotes));
  closePopover();
  updateCalendar();
}

function openPalette() { document.getElementById('paletteModal').style.display = 'flex'; }
function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
